# ADAPTS-HCT RL API hyperparameters (Hyperparameters.md; main_new.tex Table 1).
#
# This file overrides nothing: every key is commented out, so the API runs the
# design exactly as written in main_new.tex Table 1. To change a value,
# uncomment its line (and its section header) and edit it. Only overrides are
# needed; an absent key keeps its design default.
#
# - A different file can be used with ADAPTS_HYPERPARAMS=/path/to/file.yaml.
# - Unknown keys and out-of-range values stop the app at start-up with a
#   message naming the key.
# - Fractions may be written as strings such as "13/14".
# - The resolved set is frozen at the first learning update. After that the
#   app refuses to start if this file resolves differently; a change during
#   the trial is a protocol amendment: `flask hyperparams amend --reason "..."`.
# - Check a file before using it: flask hyperparams validate path/to/file.yaml
#
# discount:            {aya: "13/14", cp: "6/7", rel: 0}    # gamma per agent, [0, 1)
# trial_weeks: 14                                          # decision weeks per dyad
#
# rel_reward:
#   respondent_weights: ["1/3", "2/3"]                     # (AYA, CP), positive, sum to 1
#   w_adh: 0.0                                             # weight on the week's mean AYA level, >= 0
#
# noise:
#   sigma_sq: {aya: 0.158, cp: 0.122, rel: 0.078}          # fixed by design, normalized reward scale
#
# rewards:
#   normalize: true                                        # learn on reward / r_max
#
# penalty:
#   m: 2.0                                                 # lambda_b = m * p_b
#
# eb:
#   nu0: 4.0
#   lambda0: 0.1
#
# allocation:
#   l_min: 0.2
#   l_max: 0.8
#   c_rho: 3.5                                             # rho(0) = 1/3; c_rho = 1 gives rho(0) = 1/2
#   b_rho: 20.0                                            # native-scale slope; per agent 20 * r_max = 40 / 100 / 100
#   kappa_rho: 1.0
#   mc_samples: 500
#   mc_seed: 12345
#
# warmup:
#   n_warm: 5                                              # dyads that must have completed week 1
#   t_warm: 1                                              # weeks of per-dyad warm-up
#
# numerics:
#   j_backups: 1
#   k_max: 200
#   eps_tol: 1.0e-4
#   eps_ridge: 1.0e-6
