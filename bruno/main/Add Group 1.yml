info:
  name: Add Group 1
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/api/v1/register_group"
  body:
    type: json
    data: |-
      {
        "group_id": "{{group_id}}",
        "member_list": ["aya_001", "cp_001"],
        "consent_start_date": "2026-01-01",
        "consent_end_date": "2026-04-23"
      }
  auth: inherit

runtime:
  scripts:
    - type: pre-request
      code: |-
        // Fresh dyad id per run so each run registers a new dyad rather than
        // updating an existing one's consent window (re-registration upserts).
        bru.setVar("group_id", "dyad_" + Date.now());
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
